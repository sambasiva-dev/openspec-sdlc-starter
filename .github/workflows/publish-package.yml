name: Publish openspec-sdlc-starter to GitHub Packages

# Publishes on a version tag (v0.1.0, v0.2.0, ...) or on demand.
# The package lives in sdlc-installer/. Its payload is built from the sources in this repository root,
# so this workflow must stay at the repository root.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Test and publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdlc-installer
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js with the GitHub Packages registry
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@${{ github.repository_owner }}'

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "Tag $TAG does not match package.json version $VERSION" >&2
            exit 1
          fi

      - name: Scope the package name to the repository owner
        # GitHub Packages serves only scoped npm packages (@owner/name). The owner is taken from the
        # repository, lowercased, because npm scopes must be lowercase.
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          OWNER_LC="${OWNER,,}"
          npm pkg set name="@${OWNER_LC}/openspec-sdlc-starter"
          echo "Publishing $(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"

      - name: Check the source and run the smoke tests
        run: |
          npm run check
          npm test

      - name: Show the package contents
        run: npm pack --dry-run

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish
