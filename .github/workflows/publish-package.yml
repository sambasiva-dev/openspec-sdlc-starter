name: Publish openspec-sdlc-starter to npm

# Publishes on a version tag (v0.1.0, v0.2.0, ...) or on demand.
# The package lives in sdlc-installer/. Its payload is built from the sources in this repository root,
# so this workflow must stay at the repository root.
#
# Requires the repository secret NPM_TOKEN (an npmjs.com granular access token with read and write
# permission on packages, and 2FA bypass for CI).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # npm provenance attestation

jobs:
  publish:
    name: Test and publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdlc-installer
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js with the npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "Tag $TAG does not match package.json version $VERSION" >&2
            exit 1
          fi

      - name: Check the source and run the smoke tests
        run: |
          npm run check
          npm test

      - name: Show the package contents
        run: npm pack --dry-run

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
